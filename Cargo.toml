[package]
name = "devpack-for-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
console = "0.16.3"
dirs = "6.0.0"
env_logger = "0.11.10"
eyre = "0.6.12"
log = "0.4.33"
procfs = "0.18.0"
treeversal = { version = "0.2.0", features = ["console"] }
which = "8.0.4"
