project: devpack-for-rust

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04
      - ubuntu-24.04
      - ubuntu-22.04

suites:
  spread/general/:
    summary: Snap tests
    prepare: |
      snap install "$CRAFT_ARTIFACT" --dangerous --classic
    restore: |
      snap remove devpack-for-rust --purge --terminate

exclude:
  - .git
  - target

kill-timeout: 1h
